openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: bots
    description: Discord bot management
  - name: anthropic
    description: Anthropic AI chat operations
  - name: agent
    description: AI agent operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /bots:
    get:
      operationId: listBots
      tags: [bots]
      summary: List all bots
      description: Returns all registered bots with their current status
      responses:
        "200":
          description: List of bots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bot"

  /bots/{id}:
    get:
      operationId: getBot
      tags: [bots]
      summary: Get a single bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    delete:
      operationId: deleteBot
      tags: [bots]
      summary: Delete a bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Bot deleted
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/start:
    post:
      operationId: startBot
      tags: [bots]
      summary: Start a bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/stop:
    post:
      operationId: stopBot
      tags: [bots]
      summary: Stop a bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/restart:
    post:
      operationId: restartBot
      tags: [bots]
      summary: Restart a bot
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot restarted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/logs:
    get:
      operationId: getBotLogs
      tags: [bots]
      summary: Get bot logs
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Bot logs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotLogs"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/stats:
    get:
      operationId: getBotsStats
      tags: [bots]
      summary: Get aggregate stats for all bots
      responses:
        "200":
          description: Stats summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotsStats"

  /bots/import/github:
    post:
      operationId: importBotFromGithub
      tags: [bots]
      summary: Import a bot by cloning a GitHub repository
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportGithubBody"
      responses:
        "201":
          description: Bot imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/import/url:
    post:
      operationId: importBotFromUrl
      tags: [bots]
      summary: Import a bot by downloading a file from a URL (e.g. Replit raw file)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportUrlBody"
      responses:
        "201":
          description: Bot imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/file:
    get:
      operationId: getBotFile
      tags: [bots]
      summary: Get bot file content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: File content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotFileContent"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: saveBotFile
      tags: [bots]
      summary: Save bot file content
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotFilePayload"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/env:
    get:
      operationId: getBotEnv
      tags: [bots]
      summary: Get bot environment variables
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Env vars
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotEnvVars"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: setBotEnv
      tags: [bots]
      summary: Set bot environment variables
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BotEnvPayload"
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SaveResult"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /anthropic/conversations:
    get:
      operationId: listAnthropicConversations
      tags: [anthropic]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicConversation"
    post:
      operationId: createAnthropicConversation
      tags: [anthropic]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversation"

  /anthropic/conversations/{id}:
    get:
      operationId: getAnthropicConversation
      tags: [anthropic]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"
    delete:
      operationId: deleteAnthropicConversation
      tags: [anthropic]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnthropicError"

  /anthropic/conversations/{id}/messages:
    get:
      operationId: listAnthropicMessages
      tags: [anthropic]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AnthropicMessage"
    post:
      operationId: sendAnthropicMessage
      tags: [anthropic]
      summary: Send a message and receive an AI response (SSE stream)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewMessageBody"
      responses:
        "200":
          description: SSE stream of assistant response chunks
          content:
            text/event-stream: {}

  /agent/deploy:
    post:
      operationId: agentDeployBot
      tags: [agent]
      summary: Create or update a bot from AI-generated code
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentDeployBody"
      responses:
        "201":
          description: Bot deployed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Bot"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /bots/{id}/export/github:
    post:
      operationId: exportBotToGithub
      tags: [bots]
      summary: Push a bot file to a GitHub repository
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportGithubBody"
      responses:
        "200":
          description: Export result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExportGithubResult"
        "404":
          description: Bot not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ProjectType:
      type: string
      enum:
        - discord-bot
        - website
        - game
        - web-app
        - api-server
        - python-script

    Bot:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        filename:
          type: string
        language:
          type: string
          enum: [javascript, python]
        status:
          type: string
          enum: [running, stopped, crashed, starting]
        autoRestart:
          type: boolean
        restartCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        uptimeSeconds:
          type: number
          nullable: true
        projectType:
          $ref: "#/components/schemas/ProjectType"
      required:
        - id
        - name
        - filename
        - language
        - status
        - autoRestart
        - restartCount
        - createdAt

    BotLogs:
      type: object
      properties:
        id:
          type: string
        logs:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              level:
                type: string
                enum: [info, error]
              message:
                type: string
            required:
              - timestamp
              - level
              - message
      required:
        - id
        - logs

    BotsStats:
      type: object
      properties:
        total:
          type: integer
        running:
          type: integer
        stopped:
          type: integer
        crashed:
          type: integer
        totalRestarts:
          type: integer
      required:
        - total
        - running
        - stopped
        - crashed
        - totalRestarts

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    ImportGithubBody:
      type: object
      properties:
        name:
          type: string
        repoUrl:
          type: string
        mainFile:
          type: string
        branch:
          type: string
        token:
          type: string
      required:
        - name
        - repoUrl
        - mainFile

    ImportUrlBody:
      type: object
      properties:
        name:
          type: string
        fileUrl:
          type: string
      required:
        - name
        - fileUrl

    ImportResult:
      type: object
      properties:
        bot:
          $ref: "#/components/schemas/Bot"
        message:
          type: string
      required:
        - bot
        - message

    ExportGithubBody:
      type: object
      properties:
        repoUrl:
          type: string
        token:
          type: string
        path:
          type: string
        commitMessage:
          type: string
      required:
        - repoUrl
        - token

    ExportGithubResult:
      type: object
      properties:
        success:
          type: boolean
        url:
          type: string
        message:
          type: string
      required:
        - success
        - message

    AnthropicConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        botId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt

    MessageAttachment:
      type: object
      properties:
        type:
          type: string
          enum: [image]
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/gif, image/webp]
        data:
          type: string
          description: Base64-encoded payload (no data URI prefix)
        name:
          type: string
      required:
        - type
        - mediaType
        - data

    AnthropicMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        attachments:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/MessageAttachment"
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt

    NewConversationBody:
      type: object
      properties:
        title:
          type: string
        botId:
          type: string
          nullable: true
      required:
        - title

    NewMessageBody:
      type: object
      properties:
        content:
          type: string
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/MessageAttachment"
      required:
        - content

    AnthropicConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        botId:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/AnthropicMessage"
      required:
        - id
        - title
        - createdAt
        - messages

    AnthropicError:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    BotFileContent:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    BotFilePayload:
      type: object
      properties:
        content:
          type: string
      required:
        - content

    BotEnvVars:
      type: object
      properties:
        vars:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
              - key
              - value
      required:
        - vars

    BotEnvPayload:
      type: object
      properties:
        vars:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              value:
                type: string
            required:
              - key
              - value
      required:
        - vars

    SaveResult:
      type: object
      properties:
        saved:
          type: boolean
      required:
        - saved

    AgentDeployBody:
      type: object
      properties:
        name:
          type: string
        language:
          type: string
          enum: [javascript, python]
        code:
          type: string
      required:
        - name
        - language
        - code
